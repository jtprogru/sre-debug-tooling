# Partial container spec for `kubectl debug --custom`.
#
# The built-in netadmin profile adds NET_ADMIN and NET_RAW, but this image runs
# as uid 1000 by default and a non-root process cannot use capabilities that
# are merely permitted. Running the debug container as root is what makes
# tcpdump and nft actually work.
securityContext:
  runAsUser: 0
  runAsGroup: 0
  capabilities:
    add:
      - NET_ADMIN
      - NET_RAW
