name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: shellcheck
        run: shellcheck hack/*.sh

  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [slim, full]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Compute metadata
        id: meta
        run: |
          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${version#v}"
          fi
          {
            echo "version=${version}"
            echo "vcs_ref=$(git rev-parse --short HEAD)"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      # Single-arch first: it is what the smoke test and the scanner run
      # against, and its layers seed the cache for the multi-arch push.
      - name: Build ${{ matrix.variant }} for amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.variant }}
          platforms: linux/amd64
          load: true
          tags: sre-debug-tooling:${{ matrix.variant }}-local
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ steps.meta.outputs.vcs_ref }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max

      - name: Smoke test
        run: |
          docker run --rm -v "$PWD/hack:/hack:ro" \
            sre-debug-tooling:${{ matrix.variant }}-local \
            bash /hack/smoke-test.sh ${{ matrix.variant }}

      # Gate on what we can actually fix: OS packages with an available fix.
      # A Go stdlib CVE inside upstream kubectl is fixed by kubernetes, not
      # here, so it is reported in the next step instead of blocking.
      - name: Scan OS packages with trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sre-debug-tooling:${{ matrix.variant }}-local
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Report all vulnerabilities
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sre-debug-tooling:${{ matrix.variant }}-local
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Compute push tags
        if: github.event_name == 'push'
        id: tags
        run: |
          v="${{ steps.meta.outputs.version }}"
          variant="${{ matrix.variant }}"
          tags="${IMAGE}:${variant}-${v}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${variant}" == "slim" ]]; then
              tags="${tags},${IMAGE}:latest"
            else
              tags="${tags},${IMAGE}:full-latest"
            fi
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.variant }} (amd64 + arm64)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.variant }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ steps.meta.outputs.vcs_ref }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max
